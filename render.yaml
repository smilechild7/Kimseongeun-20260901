services:
  - type: web
    name: levit-problem-solver
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build && npm run db:build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: OPENAI_API_KEY
        sync: false
